ardu_system.name = ardu_system
ardu_system.config = ${cfg}

ardu_system.cpu.symbols = "${dir}/adc.elf"
ardu_system.loader.images = "${dir}/adc.elf"

ardu_system.serial.backends = stdout

ardu_system.duration=92ms
ardu_system.volt_pin_a=0.42 1.337 6 0.01 2.3 0

