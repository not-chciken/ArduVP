%include ${dir}/../../uno.cfg

system.atm328p.cpu.symbols = "${dir}/text_scroll.elf"
system.atm328p.loader.images = "${dir}/text_scroll.elf"

# Log the LED states, so the test output shows what the display does.
system.max7219.led_matrix.loglvl = info

# The text scrolls forever; this covers one full pass over all 26 scroll
# positions (about 81ms each), in which the text wraps around once.
system.duration=2100ms
