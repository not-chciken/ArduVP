ardu_system.name = ardu_system
ardu_system.config = ${cfg}

ardu_system.cpu.symbols = "${dir}/text_scroll.elf"
ardu_system.loader.images = "${dir}/text_scroll.elf"

ardu_system.serial.backends = stdout
ardu_system.duration=100s
ardu_system.quantum=20us

ardu_system.oled_screen.displays=sdl:1236
ardu_system.twi.out_i2c.trace=true

